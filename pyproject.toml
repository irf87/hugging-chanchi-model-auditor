[project]
name = "chanchi"
version = "0.1.0"
description = "Local auditor that turns planner/executor agent audits into model ratings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chanchi = "chanchi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chanchi"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".claude", "external-references"]

[tool.ruff.lint]
# Frequent agent shortcuts. Rationale: docs/designs/chanchi-agents-mvp.md, Layer 3, check 6.
select = ["F", "E722", "BLE001", "S110", "ERA001", "T20", "B006"]

[tool.ruff.lint.per-file-ignores]
"src/chanchi/cli.py" = ["T20"]
"src/chanchi/render.py" = ["T20"]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]
